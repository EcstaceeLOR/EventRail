openapi: 3.1.0
info:
  title: EventRail API
  version: 0.1.0
  description: Non-custodial DreamDEX Event Contract data and transaction planning.
servers:
  - url: http://localhost:4000
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Gateway health
  /v1/markets:
    get:
      operationId: listMarkets
      responses:
        "200":
          description: Normalized event markets
