openapi: 3.1.0
info:
  title: EventRail API
  version: 1.0.0
  description: Versioned, non-custodial DreamDEX Event Contract data and transaction planning.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
  - name: Markets
  - name: Plans
paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        "200":
          description: Gateway health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        default: { $ref: "#/components/responses/Error" }
  /v1/markets:
    get:
      tags: [Markets]
      operationId: listMarkets
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: phase
          in: query
          schema: { $ref: "#/components/schemas/MarketPhase" }
      responses:
        "200":
          description: Normalized market page ordered by stable market identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketPage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/markets/{marketId}:
    get:
      tags: [Markets]
      operationId: getMarket
      parameters:
        - $ref: "#/components/parameters/MarketId"
      responses:
        "200":
          description: A normalized DreamDEX event market
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventMarket" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/transaction-plans/trades:
    post:
      tags: [Plans]
      operationId: planTrade
      description: Produces an expiring plan. The connected wallet remains the only transaction signer.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradePlanRequest" }
      responses:
        "201":
          description: Deterministic transaction plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPlan" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/streams/markets:
    get:
      tags: [Markets]
      operationId: streamMarkets
      description: Server-sent event stream. Resume using Last-Event-ID.
      parameters:
        - name: marketId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Each SSE data field is a StreamEvent JSON object
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    MarketId:
      name: marketId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Error:
      description: Stable machine-readable error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
  schemas:
    Network:
      type: string
      enum: [shannon, mainnet]
    MarketPhase:
      type: string
      enum: [trading, paused, resolving, resolved, voided]
    Freshness:
      type: object
      additionalProperties: false
      required: [observedAt, sourceBlock, staleAfter]
      properties:
        observedAt: { type: string, format: date-time }
        sourceBlock: { type: integer, minimum: 0 }
        indexedBlock: { type: integer, minimum: 0 }
        staleAfter: { type: string, format: date-time }
    EventMarket:
      type: object
      additionalProperties: false
      required: [id, slug, question, category, phase, yesPrice, noPrice, volumeUsd, liquidityUsd, closesAt]
      properties:
        id: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        question: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        phase: { $ref: "#/components/schemas/MarketPhase" }
        yesPrice: { type: number, minimum: 0, maximum: 1 }
        noPrice: { type: number, minimum: 0, maximum: 1 }
        volumeUsd: { type: number, minimum: 0 }
        liquidityUsd: { type: number, minimum: 0 }
        closesAt: { type: string, format: date-time }
        network: { $ref: "#/components/schemas/Network" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    PageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, hasNextPage]
      properties:
        nextCursor: { type: [string, "null"] }
        hasNextPage: { type: boolean }
    MarketPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/EventMarket" }
        page: { $ref: "#/components/schemas/PageInfo" }
    TradePlanRequest:
      type: object
      additionalProperties: false
      required: [marketId, outcome, amountUsdso, account]
      properties:
        marketId: { type: string, minLength: 1 }
        outcome: { type: string, enum: [yes, no] }
        amountUsdso: { type: string, pattern: '^\d+(?:\.\d+)?$' }
        account: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        maxSlippageBps: { type: integer, minimum: 0, maximum: 10000, default: 100 }
    TransactionCall:
      type: object
      additionalProperties: false
      required: [to, data, value]
      properties:
        to: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        data: { type: string, pattern: "^0x(?:[0-9a-fA-F]{2})*$" }
        value: { type: string, pattern: '^\d+(?:\.\d+)?$' }
    TransactionPlan:
      type: object
      additionalProperties: false
      required:
        [
          version,
          planId,
          planHash,
          network,
          chainId,
          account,
          calls,
          summary,
          sourceBlock,
          observedAt,
          expiresAt,
          assumptions,
          expectedEffects,
        ]
      properties:
        version: { type: string, const: "1" }
        planId: { type: string, format: uuid }
        planHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        network: { $ref: "#/components/schemas/Network" }
        chainId: { type: integer, minimum: 1 }
        account: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        calls:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TransactionCall" }
        summary: { type: string, minLength: 1 }
        sourceBlock: { type: integer, minimum: 0 }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        assumptions:
          type: array
          items: { type: string, minLength: 1 }
        expectedEffects:
          type: array
          items: { type: string, minLength: 1 }
    StreamEvent:
      type: object
      description: Discriminated by type; payload shape follows that event type.
      required: [version, type, eventId, sequence, network, marketId, sourceBlock, observedAt, payload]
      properties:
        version: { type: string, const: "1" }
        type: { type: string, enum: [market.updated, book.updated, trade.confirmed, settlement.updated] }
        eventId: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 0 }
        network: { $ref: "#/components/schemas/Network" }
        marketId: { type: string, minLength: 1 }
        sourceBlock: { type: integer, minimum: 0 }
        observedAt: { type: string, format: date-time }
        payload: { type: object }
    ApiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, recoverable]
          properties:
            code:
              type: string
              enum:
                [
                  BAD_REQUEST,
                  UNAUTHORIZED,
                  NOT_FOUND,
                  CONFLICT,
                  RATE_LIMITED,
                  STALE_MARKET_STATE,
                  PLAN_EXPIRED,
                  UPSTREAM_UNAVAILABLE,
                  INTERNAL_ERROR,
                ]
            message: { type: string, minLength: 1 }
            requestId: { type: string, minLength: 1 }
            recoverable: { type: boolean }
            details: { type: object, additionalProperties: true }
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        timestamp: { type: string, format: date-time }
