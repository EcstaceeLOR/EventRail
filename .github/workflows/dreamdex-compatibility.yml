name: DreamDEX compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: read

env:
  PNPM_VERSION: 10.34.5
  NODE_VERSION: 24

jobs:
  pinned-contracts:
    name: Pinned ABI and calldata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventrail/trading... build
      - run: pnpm --filter @eventrail/trading test
      - name: Read-only Shannon smoke
        run: pnpm --filter @eventrail/dreamdex-adapter test
        env:
          DREAMDEX_LIVE_TEST: "1"
