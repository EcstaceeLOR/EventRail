name: Browser journeys

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  PNPM_VERSION: 10.34.5
  NODE_VERSION: 24

jobs:
  e2e:
    name: Chromium, Firefox, mobile, accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/playwright/cli.js install --with-deps chromium firefox
      - run: pnpm --filter @eventrail/web... build
      - run: pnpm e2e
      - name: Upload failure screenshots, videos, and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failures-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
