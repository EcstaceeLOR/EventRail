name: Feature request
description: Propose a scoped EventRail capability or improvement.
title: "[FEATURE] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Whose problem is this, and what prevents them from succeeding today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: This preserves EventRail's non-custodial model.
          required: true
        - label: I have not included secrets, private keys, or personal data.
          required: true
