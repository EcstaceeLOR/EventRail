apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eventrail.fullname" . }}-config
  labels:
    {{- include "eventrail.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  RELEASE_VERSION: {{ .Values.releaseVersion | quote }}
  HOST: "0.0.0.0"
  PORT: "4000"
  API_AUTH_REQUIRED: {{ .Values.config.apiAuthRequired | quote }}
  TRANSACTION_PLANNING_ENABLED: {{ .Values.config.transactionPlanningEnabled | quote }}
  WORKER_INTERVAL_MS: {{ .Values.config.workerIntervalMs | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  STATUS_HOST: {{ .Values.ingress.hosts.status | quote }}
