{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventrail.fullname" $ }}-{{ $name }}
  labels:
    {{- include "eventrail.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "eventrail.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        eventrail.dev/release: {{ $.Values.releaseVersion | quote }}
    spec:
      serviceAccountName: {{ include "eventrail.fullname" $ }}-{{ $name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: COMPONENT
              value: {{ $name | quote }}
          envFrom:
            - configMapRef: { name: {{ include "eventrail.fullname" $ }}-config }
            {{- if or (eq $name "gateway") (not $component.public) }}
            - secretRef: { name: {{ $.Values.runtimeSecretName }} }
            {{- end }}
          {{- if $component.public }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          livenessProbe:
            httpGet: { path: {{ $component.healthPath }}, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: {{ $component.readinessPath }}, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          {{- else }}
          livenessProbe:
            exec: { command: ["/bin/sh", "-c", "kill -0 1"] }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "kill -0 1"] }
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
{{- end }}
